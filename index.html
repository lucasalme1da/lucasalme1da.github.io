<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<meta
			name="description"
			content="Projetos de Lucas de Almeida."
		/>
		<meta
			name="theme-color"
			content="#faf9fc"
		/>
		<meta
			name="robots"
			content="index, follow"
		/>
		<link
			rel="canonical"
			href="https://lucasalme1da.github.io/"
		/>
		<link
			rel="stylesheet"
			href="styles.css"
		/>
		<title>Lucas de Almeida</title>
	</head>
	<body>
		<main>
			<section class="hero">
				<div
					class="sleeping-cat"
					aria-hidden="true"
				>
					<img
						src="sleeping-cat.png"
						alt=""
					/>
					<span class="sleep-bubble"></span>
				</div>
				<h1>Esta página está em construção</h1>
				<p class="summary">
					Em breve haverá mais projetos e informações por aqui.
				</p>
				<span>Enquanto isso, dê uma olhada</span>
			</section>

			<section
				class="projects"
				aria-label="Projeto em destaque"
			>
				<a
					class="project-card"
					href="/figma-simple-timelines/"
				>
					<div
						class="project-icon"
						aria-hidden="true"
					>
						<i></i><i></i><i></i>
					</div>
					<div class="project-copy">
						<span class="tag">Plugin para Figma · Grátis</span>
						<h3>Crie linhas do tempo e calendários no Figma</h3>
						<p>
							Configure datas e atividades, visualize o resultado e gere
							elementos editáveis no seu arquivo.
						</p>
					</div>
					<span
						class="project-arrow"
						aria-hidden="true"
						>→</span
					>
				</a>
			</section>
		</main>
	</body>
</html>
